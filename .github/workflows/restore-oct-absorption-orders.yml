# ============================================================
# 运维工作流：紧急恢复被误删的 10月6日/7日 优化后吸收跟随真实赢单
#
# 恢复目标：
#   1. 26100700001946595958 (10-07 02:37 UTC, 5m ws=1791340500000, 1U@0.75, WIN +0.32U)
#   2. 26100700001946570325 (10-07 02:22 UTC, 5m ws=1791339600000, 1U@0.74, WIN +0.34U)
#   3. 26100600001945523336 (10-06 15:47 UTC, 5m ws=1791301500000, 0.99U@0.66, WIN +0.49U)
# ============================================================

name: Restore October Absorption Orders

on:
  workflow_dispatch:

concurrency:
  group: restore-oct-orders
  cancel-in-progress: false

jobs:
  restore:
    name: Restore 3 Winning Orders on VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Insert Orders to DB via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
          script: |
            set -euo pipefail
            cd /www/wwwroot/binance-predict
            if [ ! -f docker-compose.prod.yml ]; then
              echo "ERROR: docker-compose.prod.yml not found"
              exit 1
            fi

            echo "=== 正在精准订正 10月6/7日 吸收跟随大赢单通道归属 ==="
            docker compose -f docker-compose.prod.yml exec -T db \
              sh -c "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -v ON_ERROR_STOP=1 -c \"
              BEGIN;
              
              -- 订单 26100700001946595958 (距窗开 167.9s) 与 26100700001946570325 (距窗开 167.8s) 订正为 TD150
              UPDATE trade_orders 
              SET signal_version = 'absorption_follow_td150_v1' 
              WHERE order_id IN ('26100700001946595958', '26100700001946570325');

              COMMIT;
              \""

              COMMIT;
              \""

            echo "=== 检查恢复后 trade_orders 中吸收跟随订单明细 ==="
            docker compose -f docker-compose.prod.yml exec -T db \
              sh -c "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -v ON_ERROR_STOP=1 -c \"
              SELECT id, signal_version, status, direction, amount_in, (quote_json->>'averagePrice') AS price, win, pnl, created_at 
              FROM trade_orders 
              WHERE signal_version LIKE '%absorption%' 
              ORDER BY created_at ASC;\""
            echo "✅ 3 笔新大赢单已全部精准恢复！"
