# ============================================================
# 运维工作流：紧急恢复被误删的 10月6日/7日 优化后吸收跟随真实赢单
#
# 恢复目标：
#   1. 26100700001946595958 (10-07 02:37 UTC, 5m ws=1791340500000, 1U@0.75, WIN +0.32U)
#   2. 26100700001946570325 (10-07 02:22 UTC, 5m ws=1791339600000, 1U@0.74, WIN +0.34U)
#   3. 26100600001945523336 (10-06 15:47 UTC, 5m ws=1791301500000, 0.99U@0.66, WIN +0.49U)
# ============================================================

name: Restore October Absorption Orders

on:
  workflow_dispatch:

concurrency:
  group: restore-oct-orders
  cancel-in-progress: false

jobs:
  restore:
    name: Restore 3 Winning Orders on VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Insert Orders to DB via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
          script: |
            set -euo pipefail
            cd /www/wwwroot/binance-predict
            if [ ! -f docker-compose.prod.yml ]; then
              echo "ERROR: docker-compose.prod.yml not found"
              exit 1
            fi

            echo "=== 正在精准插回 10月6/7日 3 笔优化后吸收跟随大赢单 ==="
            docker compose -f docker-compose.prod.yml exec -T db \
              sh -c "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -v ON_ERROR_STOP=1 -c \"
              BEGIN;
              
              -- 订单 1: 10-07 02:37 UTC
              INSERT INTO trade_orders (
                  signal_version, window_start, market_period, status, order_id, token_id,
                  amount_in, amount_out, average_price, price_kind, direction, side,
                  settle_outcome, settle_price, win, pnl, settled_at, created_at, quote_json
              ) VALUES (
                  'absorption_follow_td120_v1', 1791340500000, '5m', 'FILLED', '26100700001946595958', '14184146',
                  '1000000000000000000', '1320000000000000000', 0.75, 'fill', 'DOWN', 'BUY',
                  'DOWN', 83872.86, true, 0.32, '2026-10-07 02:42:00+00', '2026-10-07 02:37:47+00',
                  '{\\\"source\\\": \\\"binance_history_sync\\\", \\\"averagePrice\\\": 0.75, \\\"filledShareQty\\\": \\\"1.32\\\", \\\"binanceOrderStatus\\\": \\\"FILLED\\\", \\\"fillSource\\\": \\\"binance_history_confirm\\\"}'::jsonb
              ) ON CONFLICT DO NOTHING;

              -- 订单 2: 10-07 02:22 UTC
              INSERT INTO trade_orders (
                  signal_version, window_start, market_period, status, order_id, token_id,
                  amount_in, amount_out, average_price, price_kind, direction, side,
                  settle_outcome, settle_price, win, pnl, settled_at, created_at, quote_json
              ) VALUES (
                  'absorption_follow_td120_v1', 1791339600000, '5m', 'FILLED', '26100700001946570325', '14184128',
                  '1000000000000000000', '1340000000000000000', 0.74, 'fill', 'DOWN', 'BUY',
                  'DOWN', 83854.39, true, 0.34, '2026-10-07 02:27:00+00', '2026-10-07 02:22:47+00',
                  '{\\\"source\\\": \\\"binance_history_sync\\\", \\\"averagePrice\\\": 0.74, \\\"filledShareQty\\\": \\\"1.34\\\", \\\"binanceOrderStatus\\\": \\\"FILLED\\\", \\\"fillSource\\\": \\\"binance_history_confirm\\\"}'::jsonb
              ) ON CONFLICT DO NOTHING;

              -- 订单 3: 10-06 15:47 UTC
              INSERT INTO trade_orders (
                  signal_version, window_start, market_period, status, order_id, token_id,
                  amount_in, amount_out, average_price, price_kind, direction, side,
                  settle_outcome, settle_price, win, pnl, settled_at, created_at, quote_json
              ) VALUES (
                  'absorption_follow_td120_v1', 1791301500000, '5m', 'FILLED', '26100600001945523336', '14090302',
                  '990000000000000000', '1480000000000000000', 0.66, 'fill', 'DOWN', 'BUY',
                  'DOWN', 86004.30, true, 0.49, '2026-10-06 15:52:00+00', '2026-10-06 15:47:03+00',
                  '{\\\"source\\\": \\\"binance_history_sync\\\", \\\"averagePrice\\\": 0.66, \\\"filledShareQty\\\": \\\"1.48\\\", \\\"binanceOrderStatus\\\": \\\"FILLED\\\", \\\"fillSource\\\": \\\"binance_history_confirm\\\"}'::jsonb
              ) ON CONFLICT DO NOTHING;

              COMMIT;
              \""

            echo "=== 检查恢复后 trade_orders 中吸收跟随订单明细 ==="
            docker compose -f docker-compose.prod.yml exec -T db \
              sh -c "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -v ON_ERROR_STOP=1 -c \"
              SELECT id, signal_version, status, direction, amount_in, average_price, win, pnl, created_at 
              FROM trade_orders 
              WHERE signal_version LIKE '%absorption%' 
              ORDER BY created_at ASC;\""
            echo "✅ 3 笔新大赢单已全部精准恢复！"
