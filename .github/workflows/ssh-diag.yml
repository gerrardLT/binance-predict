# 临时诊断 workflow：从 Actions 侧验证 SSH 并查服务器侧拒绝原因（诊断完删除）
name: SSH Diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH diag
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
          script: |
            set -x
            whoami
            hostname
            echo '--- sshd_config 访问控制相关 ---'
            grep -Ei '^\s*(AllowUsers|DenyUsers|AllowGroups|DenyGroups|MaxStartups|ListenAddress|Port)\b' /etc/ssh/sshd_config || echo '(none)'
            echo '--- TCP wrappers ---'
            cat /etc/hosts.deny 2>/dev/null | grep -v '^#' | grep -v '^\s*$' || echo '(hosts.deny empty)'
            cat /etc/hosts.allow 2>/dev/null | grep -v '^#' | grep -v '^\s*$' || echo '(hosts.allow empty)'
            echo '--- fail2ban ---'
            (fail2ban-client status sshd 2>/dev/null || fail2ban-client status 2>/dev/null || echo '(no fail2ban)')
            echo '--- 防火墙 ---'
            (ufw status 2>/dev/null | head -25 || echo '(no ufw)')
            echo '--- iptables INPUT 前 40 行 ---'
            (iptables -L INPUT -n -v 2>/dev/null | head -40 || echo '(no iptables access)')
            echo '--- 云厂商安全组类：bt/1panel 防火墙 ---'
            (ls /www/server/panel/v2/ 2>/dev/null | head -5 || true)
            (bt default 2>/dev/null | head -5 || echo '(no bt cli)')
            echo '--- iptables IN_BT 链（宝塔防火墙）---'
            (iptables -L IN_BT -n -v 2>/dev/null | head -60 || echo '(no IN_BT access)')
            echo '--- 宝塔防火墙规则文件 ---'
            (grep -v '^#' /www/server/panel/v2/config.json 2>/dev/null | head -3 || true)
            (ls /www/server/panel/plugin/ 2>/dev/null | head -10 || true)
            echo '--- nftables ---'
            (nft list ruleset 2>/dev/null | head -60 || echo '(no nft)')
            echo '--- sshd 日志最近 20 行 ---'
            (journalctl -u sshd -n 20 --no-pager 2>/dev/null || journalctl -u ssh -n 20 --no-pager 2>/dev/null || tail -n 20 /var/log/auth.log 2>/dev/null || echo '(no logs)')
