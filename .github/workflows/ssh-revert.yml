# 临时：回退 sshd 端口改动（删除诊断时追加的 Port 22 / Port 2222，恢复默认 22）
name: SSH Revert

on:
  workflow_dispatch:

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - name: Revert sshd ports
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
          script: |
            set -e
            cp /etc/ssh/sshd_config /root/sshd_config.bak-sshdiag
            sed -i '/^Port 22$/d; /^Port 2222$/d' /etc/ssh/sshd_config
            grep -E '^Port' /etc/ssh/sshd_config || echo '(no Port lines, default 22)'
            sshd -t
            (systemctl restart ssh || systemctl restart sshd) || service ssh restart
            sleep 1
            ss -tln | grep -E ':22\s' && echo REVERT_OK
