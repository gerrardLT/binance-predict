name: Probe Future Markets Order

# 一次性探针：验证「提前下单后面周期」能力。
#   mode=readonly —— 只探测，绝不下单（默认）：
#     1) dump market/list 全量 BTC 5m/15m 市场（含未来周期）的 slug/起止/tradingStatus/tokenId/报价
#     2) 用放大后的 ID 预算扫 market/detail，验证 15m 未来周期是否只是被 48 ID 预算卡住
#     3) 对未来周期 token 试 get_quote（只报价，不下单）
#   mode=order —— 真实下 1 USDT 市价单到未来周期，验证能否成交（需 confirm_phrase）
# 用完即删，不常驻。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "readonly=只探测不下单 | order=真实下 1U 单到未来周期"
        required: true
        default: "readonly"
      confirm_phrase:
        description: "mode=order 时必须填 PLACE_1U_FUTURE_ORDER，否则拒绝执行"
        required: false
        default: ""
      target_offset:
        description: "下单/报价目标：往后第几个周期（1=下一周期，2=下下周期）"
        required: false
        default: "1"
      detail_scan:
        description: "market/detail 向前扫描的 ID 数量（验证扫描预算假设）"
        required: false
        default: "200"
      periods:
        description: "要探测/下单的周期，逗号分隔（如 5m 或 5m,15m）"
        required: false
        default: "5m,15m"
      min_ahead_sec:
        description: "目标窗口最少要提前多少秒开盘；不够则自动往后推一个周期"
        required: false
        default: "60"

concurrency:
  group: probe-future-markets-order
  cancel-in-progress: false

jobs:
  probe:
    name: Probe future 5m/15m markets and optional 1U order
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Run probe on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /www/wwwroot/binance-predict
            PROBE_MODE="${{ inputs.mode }}" \
            PROBE_CONFIRM="${{ inputs.confirm_phrase }}" \
            PROBE_OFFSET="${{ inputs.target_offset }}" \
            PROBE_SCAN="${{ inputs.detail_scan }}" \
            PROBE_PERIODS="${{ inputs.periods }}" \
            PROBE_MIN_AHEAD="${{ inputs.min_ahead_sec }}" \
            docker compose -f docker-compose.prod.yml exec -T \
              -e PROBE_MODE -e PROBE_CONFIRM -e PROBE_OFFSET -e PROBE_SCAN \
              -e PROBE_PERIODS -e PROBE_MIN_AHEAD \
              backend python - <<'PY'
            import asyncio
            import json
            import os
            import time
            from urllib.parse import urlparse

            from binance_predict.services import clock_sync
            from binance_predict.services.prediction_trading import BinancePredictionTrader

            MODE = (os.environ.get("PROBE_MODE") or "readonly").strip().lower()
            CONFIRM = (os.environ.get("PROBE_CONFIRM") or "").strip()
            TARGET_OFFSET = int(os.environ.get("PROBE_OFFSET") or "1")
            DETAIL_SCAN = int(os.environ.get("PROBE_SCAN") or "200")
            STEP_MS = {"5m": 300_000, "15m": 900_000}
            PERIODS = tuple(
                p.strip()
                for p in (os.environ.get("PROBE_PERIODS") or "5m,15m").split(",")
                if p.strip() in STEP_MS
            )
            MIN_AHEAD_SEC = float(os.environ.get("PROBE_MIN_AHEAD") or "60")
            TEST_AMOUNT_USDT = 1.0


            class CachedClient:
                """Cache signed GET responses so each detail ID is fetched once."""

                def __init__(self, inner):
                    self.inner = inner
                    self.cache = {}

                @property
                def is_closed(self):
                    return self.inner.is_closed

                async def get(self, url, **kwargs):
                    params = kwargs.get("params") or {}
                    path = urlparse(url).path
                    if path.endswith("/market/detail"):
                        key = ("detail", str(params.get("marketTopicId")))
                    elif path.endswith("/market/list"):
                        key = ("list", str(params.get("limit")), str(params.get("offset")))
                    else:
                        return await self.inner.get(url, **kwargs)
                    if key not in self.cache:
                        self.cache[key] = await self.inner.get(url, **kwargs)
                    return self.cache[key]

                async def post(self, url, **kwargs):
                    return await self.inner.post(url, **kwargs)

                async def aclose(self):
                    await self.inner.aclose()


            def _outcomes(market):
                """Extract (up_token, down_token, up_price, down_price, trading_status)."""
                up_t = dn_t = None
                up_p = dn_p = None
                trading = None
                for sub in market.get("markets", []):
                    if trading is None:
                        trading = sub.get("tradingStatus")
                    for o in sub.get("outcomes", []):
                        name = (o.get("name") or "").upper()
                        price = o.get("price")
                        price = float(price) if price is not None else None
                        if name in ("UP", "YES"):
                            up_t, up_p = o.get("tokenId"), price
                        elif name in ("DOWN", "NO"):
                            dn_t, dn_p = o.get("tokenId"), price
                return up_t, dn_t, up_p, dn_p, trading


            async def main():
                if MODE == "order" and CONFIRM != "PLACE_1U_FUTURE_ORDER":
                    raise SystemExit(
                        "SAFETY: mode=order 需要 confirm_phrase=PLACE_1U_FUTURE_ORDER")

                trader = BinancePredictionTrader()
                await clock_sync.sync_server_time(force=True)
                wallet = await trader.fetch_wallet_info()
                if not wallet:
                    raise SystemExit("prediction wallet unavailable")

                real_client = trader._get_client()
                trader._client = CachedClient(real_client)
                if MODE != "order":
                    async def forbidden_place_order(*a, **kw):
                        raise RuntimeError("SAFETY: place_order forbidden in readonly mode")
                    trader.place_order = forbidden_place_order

                try:
                    now_ms = clock_sync.now_ms()
                    btc_markets = await trader.list_markets()
                    now_ms = clock_sync.now_ms()

                    # ---------- Phase A: dump everything market/list returned ----------
                    rows = []
                    for m in btc_markets:
                        period = trader._classify_period(m)
                        if period is None:
                            continue
                        up_t, dn_t, up_p, dn_p, trading = _outcomes(m)
                        start = m.get("startDate")
                        end = m.get("endDate")
                        try:
                            start_ms = int(start)
                        except (TypeError, ValueError):
                            start_ms = None
                        rows.append({
                            "period": period,
                            "slug": m.get("slug"),
                            "topic_id": m.get("marketTopicId"),
                            "start": start_ms,
                            "ahead_sec": (
                                round((start_ms - now_ms) / 1000, 1)
                                if start_ms is not None else None
                            ),
                            "end": int(end) if end is not None else None,
                            "status": m.get("status"),
                            "trading_status": trading,
                            "has_up_token": bool(up_t),
                            "has_down_token": bool(dn_t),
                            "up_price": up_p,
                            "down_price": dn_p,
                            "participants": m.get("participantCount"),
                            "volume": m.get("tradeVolume"),
                        })
                    rows.sort(key=lambda r: (r["period"], r["start"] or 0))
                    print("LIST_DUMP=" + json.dumps(rows, ensure_ascii=False))

                    summary = {}
                    for period in ("5m", "15m"):
                        pr = [r for r in rows if r["period"] == period and r["start"]]
                        future = [r for r in pr if r["ahead_sec"] is not None and r["ahead_sec"] > 0]
                        tradeable_future = [
                            r for r in future if r["trading_status"] == "OPEN"
                            and r["has_up_token"] and r["has_down_token"]
                        ]
                        summary[period] = {
                            "total_in_list": len(pr),
                            "future_in_list": len(future),
                            "future_open_with_tokens": len(tradeable_future),
                            "max_ahead_sec": max(
                                (r["ahead_sec"] for r in future), default=None),
                            "future_starts": [r["start"] for r in future],
                        }
                    print("LIST_SUMMARY=" + json.dumps(summary, ensure_ascii=False))

                    # ---------- Phase B: detail scan with enlarged budget ----------
                    client = trader._get_client()

                    async def detail(topic_id):
                        try:
                            signed = trader._sign_request({"marketTopicId": topic_id})
                            resp = await client.get(
                                f"{trader.BASE_URL}/sapi/v1/w3w/wallet/prediction/market/detail",
                                params=signed,
                                headers={"X-MBX-APIKEY": trader._api_key},
                            )
                            return resp.json() if resp.status_code == 200 else None
                        except Exception:
                            return None

                    anchors = {}
                    signed = trader._sign_request({"limit": 100, "offset": 0})
                    resp = await client.get(
                        f"{trader.BASE_URL}/sapi/v1/w3w/wallet/prediction/market/list",
                        params=signed, headers={"X-MBX-APIKEY": trader._api_key})
                    for m in resp.json().get("marketTopics", []):
                        if m.get("chartType") != "CRYPTO_UP_DOWN" or m.get("symbol") != "BTCUSDT":
                            continue
                        p = trader._classify_period(m)
                        tid = m.get("marketTopicId")
                        if p and tid and p not in anchors:
                            anchors[p] = tid
                    print("ANCHORS=" + json.dumps(anchors, ensure_ascii=False))

                    anchor = anchors.get("5m") or anchors.get("15m")
                    scan = {"anchor": anchor, "budget": DETAIL_SCAN, "btc_hits": []}
                    if anchor:
                        for tid in range(anchor + 1, anchor + 1 + DETAIL_SCAN):
                            if tid <= 0:
                                continue
                            d = await detail(tid)
                            if not d:
                                continue
                            slug = d.get("slug") or ""
                            if not slug.startswith("btc-updown-"):
                                continue
                            up_t, dn_t, up_p, dn_p, trading = _outcomes(d)
                            try:
                                start_ms = int(d.get("startDate"))
                            except (TypeError, ValueError):
                                start_ms = None
                            scan["btc_hits"].append({
                                "topic_id": tid,
                                "id_delta": tid - anchor,
                                "slug": slug,
                                "start": start_ms,
                                "ahead_sec": (
                                    round((start_ms - now_ms) / 1000, 1)
                                    if start_ms else None),
                                "trading_status": trading,
                                "has_up_token": bool(up_t),
                                "has_down_token": bool(dn_t),
                                "up_price": up_p,
                                "down_price": dn_p,
                            })
                    scan["btc_hits"].sort(key=lambda h: (h["start"] or 0))
                    print("DETAIL_SCAN=" + json.dumps(scan, ensure_ascii=False))

                    # ---------- Phase C: quote (and optionally order) a future window ----------
                    for period in PERIODS:
                        step = STEP_MS[period]
                        current_start = now_ms // step * step
                        # 提前量守卫：offset 往后推，直到目标窗口至少提前
                        # MIN_AHEAD_SEC 秒开盘。否则可能踩线（窗口已开始才下单），
                        # 证明不了「提前下单」这件事。
                        offset = TARGET_OFFSET
                        target = current_start + offset * step
                        while (target - now_ms) / 1000 < MIN_AHEAD_SEC and offset < 40:
                            offset += 1
                            target = current_start + offset * step
                        entry = None
                        source = None
                        hit_slug = None
                        hit_tid = None
                        # 周期过滤：同一 epoch 可能同时是 5m 与 15m 的边界
                        # （能被 300 和 900 同时整除），只按 startDate 匹配会把
                        # 15m 的 token 当成 5m 下单（2026-09-17 实测踩到这个坑）。
                        prefix = "btc-updown-%s-" % period
                        hit = next(
                            (h for h in scan["btc_hits"]
                             if h["start"] and abs(h["start"] - target) <= 2000
                             and (h["slug"] or "").startswith(prefix)), None)
                        if hit and hit["trading_status"] == "OPEN" and hit["has_up_token"]:
                            hit_slug, hit_tid = hit["slug"], hit["topic_id"]
                            d = await detail(hit["topic_id"])
                            parsed = trader._parse_15m_entry(d) if d else None
                            if parsed:
                                entry = parsed[1]
                                source = "market/detail"
                        if entry is None or not entry.get("up_token"):
                            cached = trader._15m_markets.get(target) if period == "15m" else None
                            if cached:
                                entry, source = cached, "market/list"
                        result = {
                            "period": period,
                            "offset_used": offset,
                            "target_start": target,
                            "ahead_sec": round((target - now_ms) / 1000, 1),
                            "found": bool(entry and entry.get("up_token")),
                            "source": source,
                            "market_slug": hit_slug,
                            "topic_id": hit_tid,
                            "up_quote": None,
                            "down_quote": None,
                            "ordered": False,
                        }
                        if entry and entry.get("up_token"):
                            for side_name, key in (("up_quote", "up_token"),
                                                   ("down_quote", "down_token")):
                                token = entry.get(key)
                                if not token:
                                    continue
                                q = await trader.get_quote(token, amount_usdt=TEST_AMOUNT_USDT)
                                if q:
                                    result[side_name] = {
                                        "average_price": q.get("averagePrice"),
                                        "amount_in": q.get("amountIn"),
                                        "amount_out": q.get("amountOut"),
                                        "quote_id": q.get("quoteId"),
                                    }
                            if MODE == "order" and result["up_quote"]:
                                token = entry["up_token"]
                                q = await trader.get_quote(
                                    token, amount_usdt=TEST_AMOUNT_USDT)
                                if not q:
                                    result["order_error"] = "re-quote failed"
                                else:
                                    order = await trader.place_order(q, slippage_bps=1200)
                                    if not order:
                                        result["order_error"] = (
                                            trader.last_api_error or "place_order returned None")
                                    else:
                                        oid = order.get("orderId")
                                        confirmed = await trader.confirm_order_status(oid)
                                        conf_slug = (confirmed or {}).get("slug") or ""
                                        result["ordered"] = True
                                        result["order"] = {
                                            "order_id": oid,
                                            "raw_status": order.get("status"),
                                            "confirmed": confirmed,
                                            "token_id_tail": str(token)[-12:],
                                            "window_start": target,
                                            # 自检：币安回执的 slug 必须属于本周期，
                                            # 否则说明又押错周期了
                                            "confirmed_slug": conf_slug,
                                            "period_matches": conf_slug.startswith(prefix),
                                        }
                        print(f"ORDER_PROBE_{period}=" + json.dumps(result, ensure_ascii=False))
                finally:
                    await trader.aclose()


            asyncio.run(main())
            PY
