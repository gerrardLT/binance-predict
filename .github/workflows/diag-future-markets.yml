name: Diag Future Markets

# 一次性只读诊断：生产容器内直调 scan_future_markets / get_future_markets_cached，
# 排查「未来窗口消失」。禁止下单（place_order 被替换为抛异常）。用完即删。

on:
  workflow_dispatch:

concurrency:
  group: diag-future-markets
  cancel-in-progress: false

jobs:
  diag:
    name: Read-only diagnosis on VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Run diag on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /www/wwwroot/binance-predict
            docker compose -f docker-compose.prod.yml exec -T backend python - <<'PY'
            import asyncio
            import json
            import time

            from binance_predict.services import clock_sync
            from binance_predict.services.prediction_trading import BinancePredictionTrader


            async def main():
                trader = BinancePredictionTrader()
                await clock_sync.sync_server_time()
                wallet = await trader.fetch_wallet_info()
                print("wallet_ok=", bool(wallet))

                await trader.list_markets()
                print("5m_start_date=", trader._5m_start_date)
                print("15m_start_date=", trader._15m_start_date)
                print("15m_markets_keys=", sorted(trader._15m_markets.keys()))

                async def forbidden_place_order(*a, **kw):
                    raise RuntimeError("SAFETY: place_order forbidden in diag")

                trader.place_order = forbidden_place_order

                # 全量 list 的 BTC 市场 + 锚点后 40 个 tid 抽样 + 未来 5m 窗 slug 反查
                now_ms = int(time.time() * 1000)
                client = trader._get_client()
                signed = trader._sign_request({"limit": 100, "offset": 0})
                resp = await client.get(
                    f"{trader.BASE_URL}/sapi/v1/w3w/wallet/prediction/market/list",
                    params=signed, headers={"X-MBX-APIKEY": trader._api_key})
                btc_topics = []
                for m in resp.json().get("marketTopics", []):
                    if m.get("chartType") == "CRYPTO_UP_DOWN" and m.get("symbol") == "BTCUSDT":
                        btc_topics.append({"tid": m.get("marketTopicId"),
                                           "slug": m.get("slug"),
                                           "start": m.get("startDate")})
                print("BTC_LIST=" + json.dumps(btc_topics, ensure_ascii=False))
                anchor_tuple = await trader._list_btc_anchor("5m")
                print("ANCHOR_5m=", anchor_tuple)
                if anchor_tuple:
                    anchor = anchor_tuple[0]
                    sample = []
                    for tid in range(anchor + 1, anchor + 41):
                        d = await trader._detail_one(tid)
                        if d is None:
                            sample.append({"tid": tid, "r": None})
                        else:
                            sample.append({"tid": tid, "slug": d.get("slug"),
                                           "st": d.get("startDate")})
                    print("SAMPLE_40=" + json.dumps(sample, ensure_ascii=False))
                    # 反查：下一 5m 窗（now+300s 对齐）slug 直接构造，双向扫 500 找它
                    want_epoch = (now_ms + 300_000) // 300_000 * 300_000 // 1000
                    slug_want = f"btc-updown-5m-{want_epoch}"
                    found = []
                    for tid in range(anchor - 100, anchor + 500):
                        d = await trader._detail_one(tid)
                        if d and d.get("slug") == slug_want:
                            found.append({"tid": tid, "slug": slug_want})
                            break
                    print("FUTURE_5M_FOUND=" + json.dumps(found, ensure_ascii=False))

                for period in ("5m", "15m"):
                    windows = await trader.scan_future_markets(period, count=8)
                    print(f"RAW_SCAN_{period}=" + json.dumps(
                        [{"start": w["window_start"], "ahead": w["ahead_sec"],
                          "up": w["up_price"], "dn": w["down_price"]} for w in windows],
                        ensure_ascii=False))
                    cached, age = await trader.get_future_markets_cached(period, 8)
                    print(f"CACHED_{period}=" + json.dumps(
                        [{"start": w["window_start"]} for w in cached], ensure_ascii=False)
                        + f" age={age}")

                await trader.aclose()


            asyncio.run(main())
            PY
