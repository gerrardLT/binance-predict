# 临时数据取回：dump misalignment_signals 全表（quote_momentum_v1/v2）→ 临时分支
# 背景：/api/misalignment/signals 硬上限 200 条，v1 全历史 505 笔取不回；
# 经 Actions SSH 通道直连生产 DB 导出行级数据（含 entry_quote_ts），
# 用于 qm_v2 科学评估的全历史配对分析。用后即删本 workflow 与临时分支。
name: QM Data Dump

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump misalignment_signals via VPS SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
          script: |
            set -euo pipefail
            cd /www/wwwroot/binance-predict
            DB_USER=$(grep -E '^DB_USER=' .env | head -1 | cut -d= -f2 | tr -d '\r"' | xargs || true)
            DB_PASSWORD=$(grep -E '^DB_PASSWORD=' .env | head -1 | cut -d= -f2- | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' || true)
            DB_NAME=$(grep -E '^DB_NAME=' .env | head -1 | cut -d= -f2 | tr -d '\r"' | xargs || true)
            DB_USER=${DB_USER:-postgres}; DB_NAME=${DB_NAME:-binance_predict}
            if [ -z "${DB_PASSWORD}" ]; then echo "DB_PASSWORD 未取到"; exit 1; fi
            CONTAINER=$(docker compose -f docker-compose.prod.yml ps -q db)
            if [ -z "${CONTAINER}" ]; then echo "db 容器未找到"; exit 1; fi
            echo "container=${CONTAINER} db=${DB_NAME}"
            docker exec -e PGPASSWORD="${DB_PASSWORD}" "${CONTAINER}" \
              psql -U "${DB_USER}" -d "${DB_NAME}" -c "COPY (SELECT id, version, window_start, window_end, end_pct, outcome_base, direction, target_window_start, entry_down_price, entry_up_price, entry_quote_ts, entry_quote_kind, settle_outcome, win, ev_at_entry, status FROM misalignment_signals ORDER BY version, window_start) TO STDOUT WITH CSV HEADER" \
              > /tmp/qm_signals_dump.csv
            test -s /tmp/qm_signals_dump.csv || { echo "dump 为空"; exit 1; }
            wc -l /tmp/qm_signals_dump.csv
            head -2 /tmp/qm_signals_dump.csv
      - name: Fetch dump content (base64 via ssh-action capture_stdout)
        id: fetch
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
          capture_stdout: true
          script: |
            set -euo pipefail
            test -s /tmp/qm_signals_dump.csv || { echo "dump 文件缺失"; exit 1; }
            echo QMDUMPBEGIN
            base64 -w0 /tmp/qm_signals_dump.csv
            echo
            echo QMDUMPEND
            rm -f /tmp/qm_signals_dump.csv
      - name: Decode dump and push to temp branch
        shell: bash
        run: |
          cat > stdout.raw <<'EOF_B64'
          ${{ steps.fetch.outputs.stdout }}
          EOF_B64
          sed -n '/QMDUMPBEGIN/,/QMDUMPEND/p' stdout.raw | grep -v QMDUMP \
            | tr -cd 'A-Za-z0-9+/=' > dump.b64
          test -s dump.b64 || { echo "定界提取失败"; cat stdout.raw | head -5; exit 1; }
          base64 -d dump.b64 > qm_signals_dump.csv
          wc -l qm_signals_dump.csv
          head -2 qm_signals_dump.csv
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git checkout -b tmp/qm-data-dump
          git add qm_signals_dump.csv
          git commit -m "data(temp): misalignment_signals qm_v1/v2 全历史行级 dump（取回后删分支）"
          git push -f origin tmp/qm-data-dump
